name: Render Short
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project folder (holds short.json)
        default: projects/hanoi-rats
      mode:
        description: stills (stop-frame check) | preview (half-size 8 s) | full
        type: choice
        options: [stills, preview, full]
        default: stills
      voice_target:
        description: Target voice length in seconds (speeds the TTS up to reach it)
        default: "36"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      P: ${{ inputs.project }}
      S: ricksclips-short-style/scripts/stage
      D: ricksclips-short-style/examples/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null
      - run: cd $S && npm install --silent && npx playwright install --with-deps chromium > /dev/null
      - run: pip install -q numpy pillow scipy opencv-python-headless soundfile faster-whisper kokoro
      - name: Library (fonts, demo textures and cart, drawn assets)
        run: |
          mkdir -p $P/fonts $P/textures $P/models $P/audio
          [ -f $P/fonts/Montserrat-ExtraBold.ttf ] || curl -sL -o $P/fonts/Montserrat-ExtraBold.ttf https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-ExtraBold.ttf
          cp -n $D/textures/cobble.jpg $D/textures/plaster.jpg $P/textures/ ; cp -n $D/models/cart.glb $P/models/
          python $P/tools/make_assets.py $P $P/fonts/Montserrat-ExtraBold.ttf
      - name: Music (synthesised in code) if missing
        run: |
          if [ ! -f $P/audio/music.mp3 ]; then
            python $P/tools/make_music.py $P/audio/music.wav 44
            ffmpeg -loglevel error -y -i $P/audio/music.wav -b:a 192k $P/audio/music.mp3 && rm $P/audio/music.wav
          fi
      - name: Voice (Kokoro TTS, free, local) if missing
        env: { VOICE_TARGET: "${{ inputs.voice_target }}" }
        run: |
          if [ ! -f $P/audio/voice.mp3 ]; then
            python - <<'PY'
          import os, numpy as np, soundfile as sf
          from kokoro import KPipeline
          d = os.environ["P"] + "/audio/"; SR = 24000
          text = open(d + ("tts.txt" if os.path.exists(d + "tts.txt") else "script.txt"), encoding="utf-8").read()
          pipe = KPipeline(lang_code="a", repo_id="hexgrad/Kokoro-82M")
          def gen(speed):
              parts = []
              for _, _, a in pipe(text, voice="af_heart", speed=speed, split_pattern=r"\n+"):
                  a = np.asarray(a, dtype=np.float32); idx = np.where(np.abs(a) > 0.012)[0]
                  if len(idx): a = a[max(0, idx[0] - int(0.04 * SR)): min(len(a), idx[-1] + int(0.16 * SR))]
                  parts += [a, np.zeros(int(0.05 * SR), np.float32)]
              return np.concatenate(parts)
          a = gen(1.0); dur = len(a) / SR; print("speed 1.00 -> %.1f s" % dur)
          target = float(os.environ.get("VOICE_TARGET", "36")); sp = min(1.3, max(1.0, dur / target))
          if sp > 1.03: a = gen(round(sp, 2)); print("speed %.2f -> %.1f s" % (sp, len(a) / SR))
          sf.write(d + "voice.wav", a / max(1e-6, np.abs(a).max()) * 0.9, SR)
          PY
            ffmpeg -loglevel error -y -i $P/audio/voice.wav -b:a 192k $P/audio/voice.mp3 && rm $P/audio/voice.wav
            rm -f $P/audio/words.json
          fi
      - name: Word timings (faster-whisper) if missing
        run: |
          [ -f $P/audio/words.json ] || SHORTKIT_WHISPER_MODEL=small python $S/shortkit.py words $P/audio/voice.mp3 $P/audio/script.txt -o $P/audio/words.json
          python -c "import json;w=json.load(open('$P/audio/words.json'));print('voice %.2f s, %d words, %s'%(w['duration'],len(w['words']),w['method']))"
      - name: Stop-frame check
        run: |
          set -o pipefail
          node $S/render.mjs $P/short.json $P/render.mp4 --stills 2>&1 | tee $P/stills_report.txt || true
          ls $P/render_stills 2>/dev/null | head -3; find $P -name sheet.jpg
      - name: Render
        if: inputs.mode != 'stills'
        run: |
          if [ "${{ inputs.mode }}" = "preview" ]; then node $S/render.mjs $P/short.json $P/preview.mp4 --scale 0.5 --from 0 --to 8; else node $S/render.mjs $P/short.json $P/render.mp4; fi
          [ "${{ inputs.mode }}" = "full" ] && python $S/shortkit.py check $P/render.mp4 | tee $P/check_report.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            ${{ inputs.project }}/stills_report.txt
            ${{ inputs.project }}/check_report.txt
            ${{ inputs.project }}/assets_preview.jpg
            ${{ inputs.project }}/**/sheet.jpg
            ${{ inputs.project }}/preview.mp4
            ${{ inputs.project }}/render.mp4
          if-no-files-found: ignore
      - name: Commit library, audio and video to the repo
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          rm -rf $P/*_stills
          git add -A $P && git commit -qm "Build $P (${{ inputs.mode }})" && git push -q || echo "nothing to commit"
