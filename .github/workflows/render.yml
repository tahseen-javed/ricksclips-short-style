name: Render Short
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project folder (holds short.json)
        default: projects/hanoi-rats
      mode:
        description: "stills = check + contact sheets | frames = sheet of a time range | preview = half-size clip | full = final video"
        type: choice
        options: [stills, frames, preview, full]
        default: stills
      voice_target:
        description: Target voice length in seconds
        default: "38"
      redo_voice:
        description: Regenerate voice, music and word timings
        type: boolean
        default: false
      ranges:
        description: "frames mode: time ranges in seconds, e.g. 1-3,6-8"
        default: "1-3,6-8,19.5-21,26-28.5"
      t_from:
        description: Start second (preview)
        default: "0"
      t_to:
        description: End second (frames / preview)
        default: "8"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      P: ${{ inputs.project }}
      S: ricksclips-short-style/scripts/stage
      D: ricksclips-short-style/examples/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null
      - run: cd $S && npm install --silent && npx playwright install --with-deps chromium > /dev/null
      - run: pip install -q numpy pillow scipy opencv-python-headless soundfile

      - name: Library (font, demo textures and cart, drawn assets)
        run: |
          mkdir -p $P/fonts $P/textures $P/models $P/audio
          [ -f $P/fonts/Montserrat-ExtraBold.ttf ] || curl -sL -o $P/fonts/Montserrat-ExtraBold.ttf https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-ExtraBold.ttf
          for f in cobble.jpg plaster.jpg; do [ -f $P/textures/$f ] || cp $D/textures/$f $P/textures/; done
          [ -f $P/models/cart.glb ] || cp $D/models/cart.glb $P/models/
          python $P/tools/make_assets.py $P $P/fonts/Montserrat-ExtraBold.ttf

      - name: Music (synthesised in code)
        run: |
          if [ "${{ inputs.redo_voice }}" = "true" ] || [ ! -f $P/audio/music.mp3 ]; then
            python $P/tools/make_music.py $P/audio/music.wav 44
            ffmpeg -loglevel error -y -i $P/audio/music.wav -b:a 192k $P/audio/music.mp3 && rm $P/audio/music.wav
          fi

      - name: Voice (Kokoro TTS, free and local) and word timings (CTC forced alignment)
        run: |
          set -o pipefail
          need_tts=0; need_align=0
          if [ "${{ inputs.redo_voice }}" = "true" ] || [ ! -f $P/audio/voice.mp3 ]; then need_tts=1; fi
          if [ $need_tts = 1 ] || [ ! -f $P/audio/words.json ] || ! grep -q '"method": "ctc"' $P/audio/words.json; then need_align=1; fi
          if [ $need_tts = 1 ] || [ $need_align = 1 ]; then
            pip install -q torch==2.5.1 torchaudio==2.5.1 --extra-index-url https://download.pytorch.org/whl/cpu
            pip install -q kokoro openai-whisper
          fi
          if [ $need_tts = 1 ]; then
            rm -f $P/audio/voice.mp3 $P/audio/words.json
            python $P/tools/make_voice.py $P/audio ${{ inputs.voice_target }} | tee $P/voice_report.txt
          fi
          if [ $need_align = 1 ]; then
            if ! python $P/tools/align_words.py $P/audio/voice.mp3 $P/audio/script.txt $P/audio/spoken.json $P/audio/words.json 2>&1 | tee -a $P/voice_report.txt; then
              echo "CTC alignment failed - falling back to Whisper timings" | tee -a $P/voice_report.txt
              SHORTKIT_WHISPER_MODEL=small python $S/shortkit.py words $P/audio/voice.mp3 $P/audio/script.txt -o $P/audio/words.json | tee -a $P/voice_report.txt
            fi
            SHORTKIT_WHISPER_MODEL=small python $P/tools/check_voice.py $P/audio/voice.mp3 $P/audio/tts.txt | tee -a $P/voice_report.txt || true
          fi
          python -c "import json;w=json.load(open('$P/audio/words.json'));print('voice %.2f s, %d words, timings: %s'%(w['duration'],len(w['words']),w['method']))"

      - name: Scene (short.json from the shot list)
        run: python $P/tools/build_short.py $P | tee $P/scene_report.txt

      - name: Stop-frame check
        run: |
          set -o pipefail
          node $S/render.mjs $P/short.json $P/render.mp4 --stills 2>&1 | tee $P/stills_report.txt || true
          python $P/tools/montage.py stills $P/render_stills $P/sheets
          grep -E "flagged|problems" $P/stills_report.txt || echo "stills: no flags"

      - name: Frames (contact sheets of time ranges)
        if: inputs.mode == 'frames'
        run: |
          i=0
          for r in $(echo "${{ inputs.ranges }}" | tr ',' ' '); do
            a=${r%-*}; b=${r#*-}; i=$((i+1))
            node $S/render.mjs $P/short.json $P/range$i.mp4 --scale 0.5 --from $a --to $b
            mkdir -p $P/rframes$i && ffmpeg -loglevel error -y -i $P/range$i.mp4 -vf "fps=5" $P/rframes$i/f%03d.png
            python $P/tools/montage.py frames $P/rframes$i $P/sheets_range_$i.jpg $a 5
          done

      - name: Preview clip
        if: inputs.mode == 'preview'
        run: node $S/render.mjs $P/short.json $P/preview.mp4 --scale 0.5 --from ${{ inputs.t_from }} --to ${{ inputs.t_to }}

      - name: Full render (only if the stop-frame check is clean)
        if: inputs.mode == 'full'
        run: |
          if grep -q "flagged" $P/stills_report.txt; then echo "stop-frame check has flags - fix before the full render"; exit 1; fi
          node $S/render.mjs $P/short.json $P/render.mp4
          python $S/shortkit.py check $P/render.mp4 | tee $P/check_report.txt || true
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,duration -of default=nw=1 $P/render.mp4 | tee -a $P/check_report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: |
            ${{ inputs.project }}/sheets
            ${{ inputs.project }}/sheets_range_*.jpg
            ${{ inputs.project }}/render_stills
            ${{ inputs.project }}/stills_report.txt
            ${{ inputs.project }}/scene_report.txt
            ${{ inputs.project }}/voice_report.txt
            ${{ inputs.project }}/check_report.txt
            ${{ inputs.project }}/assets_preview.jpg
            ${{ inputs.project }}/preview.mp4
            ${{ inputs.project }}/render.mp4
          if-no-files-found: ignore

      - name: Save audio, scene and final video to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f $P/short.json $P/audio $P/voice_report.txt $P/scene_report.txt $P/stills_report.txt 2>/dev/null || true
          [ "${{ inputs.mode }}" = "full" ] && [ -f $P/render.mp4 ] && git add -f $P/render.mp4 $P/check_report.txt || true
          git commit -qm "Build $P (${{ inputs.mode }})" && { git pull --rebase -q; git push -q; } || echo "nothing to commit"
